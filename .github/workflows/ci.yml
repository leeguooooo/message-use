name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bunx tsc --noEmit
      - name: build and smoke test binary
        run: |
          bun build --compile src/cli.ts --outfile /tmp/message-use
          codesign --force --sign - /tmp/message-use
          /tmp/message-use version
